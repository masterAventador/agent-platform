[[permission]]
identifier = "allow-platform-capabilities"
description = "允许主窗口读取桌面平台能力"
commands.allow = ["platform_capabilities"]

[[permission]]
identifier = "allow-platform-runtime-config"
description = "允许主窗口读取经过校验的桌面运行时端点"
commands.allow = ["platform_runtime_config"]

[[permission]]
identifier = "allow-secure-credentials"
description = "允许主窗口通过系统凭据存储读写应用凭据"
commands.allow = ["credential_get", "credential_set", "credential_delete"]

[[permission]]
identifier = "allow-remembered-login-storage"
description = "允许主窗口在 App 私有数据目录读写 Demo 登录信息"
commands.allow = [
  "remembered_login_get",
  "remembered_login_set",
  "remembered_login_delete",
]

[[permission]]
identifier = "allow-local-executor"
description = "允许主窗口管理受认证的本地执行器 Sidecar"
commands.allow = [
  "local_executor_start",
  "local_executor_invoke",
  "local_executor_status",
  "local_executor_stop",
]

[[permission]]
identifier = "allow-social-operations"
description = "允许主窗口管理已授权的自动运营 Sidecar、账号会话与紧急停止"
commands.allow = [
  "social_sidecar_install",
  "social_sidecar_download",
  "social_account_prepare",
  "social_account_login_signal",
  "social_account_store_cookies",
  "social_account_has_cookies",
  "social_account_start",
  "social_account_invoke",
  "social_account_logout",
  "social_account_emergency_stop",
  "social_executor_take_safe_diagnostics",
]
