name: agent-platform-app

x-backend-build: &backend-build
  context: ../../backend
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  AGENT_PLATFORM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_platform}
  AGENT_PLATFORM_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  AGENT_PLATFORM_MINIO_ENDPOINT: minio:9000
  AGENT_PLATFORM_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-agent_platform}
  AGENT_PLATFORM_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  AGENT_PLATFORM_MINIO_SECURE: "false"
  AGENT_PLATFORM_RAGFLOW_URL: ${RAGFLOW_URL:-http://host.docker.internal:19380}
  AGENT_PLATFORM_RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
  # 审计哈希链 HMAC 密钥：本地默认公开弱密钥仅限开发；生产必须显式覆盖。
  AGENT_PLATFORM_AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-agent-platform-insecure-dev-audit-hmac-key}
  AGENT_PLATFORM_AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AGENT_PLATFORM_AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
  AGENT_PLATFORM_OTEL_ENABLED: ${OTEL_ENABLED:-false}
  AGENT_PLATFORM_OTEL_OTLP_ENDPOINT: ${OTEL_OTLP_ENDPOINT:-http://host.docker.internal:4317}

x-host-gateway: &host-gateway
  - host.docker.internal:host-gateway

services:
  migrate:
    build: *backend-build
    image: ${PLATFORM_BACKEND_IMAGE:-agent-platform-backend:local}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    extra_hosts: *host-gateway
    networks: [core]
    restart: "no"

  api:
    build: *backend-build
    image: ${PLATFORM_BACKEND_IMAGE:-agent-platform-backend:local}
    environment:
      <<: *backend-environment
      AGENT_PLATFORM_OTEL_SERVICE_NAME: agent-platform-api
    extra_hosts: *host-gateway
    networks: [default, core]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

  dispatcher:
    build: *backend-build
    image: ${PLATFORM_BACKEND_IMAGE:-agent-platform-backend:local}
    command: ["python", "-m", "agent_platform.workers.dispatcher_main"]
    environment:
      <<: *backend-environment
      AGENT_PLATFORM_OTEL_SERVICE_NAME: agent-platform-dispatcher
      AGENT_PLATFORM_DISPATCHER_REPLICAS: "1"
      AGENT_PLATFORM_DISPATCHER_BATCH_SIZE: ${DISPATCHER_BATCH_SIZE:-100}
      AGENT_PLATFORM_DISPATCHER_IDLE_BACKOFF_SECONDS: ${DISPATCHER_IDLE_BACKOFF_SECONDS:-0.5}
    extra_hosts: *host-gateway
    networks: [core]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/agent-platform-dispatcher-ready"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
    restart: "no"

  worker:
    profiles: ["worker"]
    build: *backend-build
    image: ${PLATFORM_BACKEND_IMAGE:-agent-platform-backend:local}
    command: ["python", "-m", "agent_platform.workers.main"]
    environment:
      <<: *backend-environment
      AGENT_PLATFORM_OTEL_SERVICE_NAME: agent-platform-worker
      AGENT_PLATFORM_WORKER_REPLICAS: "1"
      AGENT_PLATFORM_QUEUE_PENDING_MIN_IDLE_MS: ${AGENT_PLATFORM_QUEUE_PENDING_MIN_IDLE_MS:-1000}
      AGENT_PLATFORM_QUEUE_MAX_DELIVERY_ATTEMPTS: ${AGENT_PLATFORM_QUEUE_MAX_DELIVERY_ATTEMPTS:-5}
      AGENT_PLATFORM_RUN_QUEUE_DEAD_LETTER_STREAM_NAME: ${AGENT_PLATFORM_RUN_QUEUE_DEAD_LETTER_STREAM_NAME:-agent-platform:runs:dlq}
      AGENT_PLATFORM_WORKER_RETRY_BACKOFF_SECONDS: ${AGENT_PLATFORM_WORKER_RETRY_BACKOFF_SECONDS:-1.0}
      AGENT_PLATFORM_SANDBOX_PROVIDER: local-controller
      AGENT_PLATFORM_SANDBOX_CONTROLLER_URL: http://sandbox-controller:8090
      AGENT_PLATFORM_SANDBOX_CONTROLLER_SECRET: ${SANDBOX_CONTROLLER_BEARER_SECRET:?set SANDBOX_CONTROLLER_BEARER_SECRET}
      AGENT_PLATFORM_SANDBOX_CONTROLLER_REQUEST_TIMEOUT_SECONDS: ${SANDBOX_CONTROLLER_REQUEST_TIMEOUT_SECONDS:-130}
      AGENT_PLATFORM_SANDBOX_TTL_SECONDS: ${SANDBOX_TTL_SECONDS:-3600}
      AGENT_PLATFORM_LLM_GATEWAY_URL: ${AGENT_PLATFORM_LLM_GATEWAY_URL:-http://litellm:4000/v1}
      AGENT_PLATFORM_LLM_GATEWAY_API_KEY: ${AGENT_PLATFORM_LLM_GATEWAY_API_KEY:?set AGENT_PLATFORM_LLM_GATEWAY_API_KEY}
    extra_hosts: *host-gateway
    networks: [core, sandbox-control, llm]
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/agent-platform-worker-ready"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
    restart: "no"

  sandbox-janitor:
    profiles: ["worker"]
    build: *backend-build
    image: ${PLATFORM_BACKEND_IMAGE:-agent-platform-backend:local}
    command: ["python", "-m", "agent_platform.workers.sandbox_janitor"]
    environment:
      <<: *backend-environment
      AGENT_PLATFORM_SANDBOX_CONTROLLER_URL: http://sandbox-controller:8090
      AGENT_PLATFORM_SANDBOX_CONTROLLER_SECRET: ${SANDBOX_CONTROLLER_BEARER_SECRET:?set SANDBOX_CONTROLLER_BEARER_SECRET}
      AGENT_PLATFORM_SANDBOX_CONTROLLER_REQUEST_TIMEOUT_SECONDS: ${SANDBOX_CONTROLLER_REQUEST_TIMEOUT_SECONDS:-130}
      AGENT_PLATFORM_SANDBOX_JANITOR_REPLICAS: "1"
      AGENT_PLATFORM_SANDBOX_JANITOR_INTERVAL_SECONDS: ${SANDBOX_JANITOR_INTERVAL_SECONDS:-30}
      AGENT_PLATFORM_SANDBOX_JANITOR_BATCH_SIZE: ${SANDBOX_JANITOR_BATCH_SIZE:-100}
    networks: [core, sandbox-control]
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/agent-platform-sandbox-janitor-ready"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
    restart: "no"

  sandbox-controller:
    profiles: ["worker"]
    build: *backend-build
    image: ${PLATFORM_BACKEND_IMAGE:-agent-platform-backend:local}
    command:
      - uvicorn
      - agent_platform.sandbox.controller.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    environment:
      SANDBOX_CONTROLLER_BEARER_SECRET: ${SANDBOX_CONTROLLER_BEARER_SECRET:?set SANDBOX_CONTROLLER_BEARER_SECRET}
      SANDBOX_CONTROLLER_IMAGE: ${SANDBOX_CONTROLLER_IMAGE:-python:3.12.13-slim-bookworm@sha256:8a7e7cc04fd3e2bd787f7f24e22d5d119aa590d429b50c95dfe12b3abe52f48b}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    # Controller 是唯一 Docker 特权边界；仅它以 root 访问 socket，Worker 保持非 root。
    user: "0:0"
    networks: [sandbox-control]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "no"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_BUILD_MODE: ${PLATFORM_FRONTEND_BUILD_MODE:-production}
    image: ${PLATFORM_FRONTEND_IMAGE:-agent-platform-frontend:local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PLATFORM_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "no"

networks:
  core:
    external: true
    name: ${CORE_NETWORK_NAME:-agent-platform_default}
  sandbox-control:
    internal: true
  llm:
    external: true
    name: ${LITELLM_NETWORK_NAME:-agent-platform-llm}
