name: agent-platform-litellm

services:
  litellm-db:
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    environment:
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks: [database]
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm-non_root:v1.86.2@sha256:511b513bc68956793433d62c1812daff56984325543f6a15431c622823fd90cb
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_UPSTREAM_MODEL: ${LITELLM_UPSTREAM_MODEL:?set LITELLM_UPSTREAM_MODEL}
      LITELLM_UPSTREAM_API_KEY: ${LITELLM_UPSTREAM_API_KEY:-}
      LITELLM_UPSTREAM_API_BASE: ${LITELLM_UPSTREAM_API_BASE:-}
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}@litellm-db:5432/${LITELLM_DB_NAME:-litellm}
      ENFORCE_PRISMA_MIGRATION_CHECK: "true"
      LITELLM_MIGRATION_DIR: /app/migrations
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    networks: [database, llm]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65534,gid=65534
      - /app/migrations:rw,noexec,nosuid,nodev,size=64m,uid=65534,gid=65534,mode=0700
    restart: "no"

  worker-key-bootstrap:
    image: ghcr.io/berriai/litellm-non_root:v1.86.2@sha256:511b513bc68956793433d62c1812daff56984325543f6a15431c622823fd90cb
    entrypoint: ["python3"]
    command: ["/bootstrap/bootstrap_key.py"]
    environment:
      LITELLM_BOOTSTRAP_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_WORKER_API_KEY: ${LITELLM_WORKER_API_KEY:?set LITELLM_WORKER_API_KEY}
    volumes:
      - ../litellm/bootstrap_key.py:/bootstrap/bootstrap_key.py:ro
    depends_on:
      litellm:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks: [database]
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=65534,gid=65534
    restart: "no"

networks:
  database:
    internal: true
  llm:
    external: true
    name: ${LITELLM_NETWORK_NAME:-agent-platform-llm}

volumes:
  litellm_db_data:
