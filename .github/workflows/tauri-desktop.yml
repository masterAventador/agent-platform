name: Tauri desktop validation

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/tauri-desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }} build and smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vitest run src/platform/platform-adapter.test.ts src/platform/platform-boundary.test.ts
      - run: pnpm tauri:test:rust
      - name: Build production desktop binary without test driver
        run: pnpm tauri build --debug --no-bundle
      - name: Run real desktop smoke tests
        run: pnpm test:tauri
